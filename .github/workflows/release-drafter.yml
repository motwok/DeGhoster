name: Release Drafter

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  # Apply the labels the release notes are grouped by, and that decide the next
  # version. Release Drafter v7 split the action in two: the root action only
  # drafts, and labelling moved to the autolabeler sub-action. Calling the root
  # action on a pull request, as this workflow used to, therefore labelled
  # nothing at all - which is how pull requests reached master unlabelled.
  autolabel:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7
        with:
          config-name: release-drafter.yml

  # Rebuild the draft release notes from the pull requests merged so far.
  update_release_draft:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
