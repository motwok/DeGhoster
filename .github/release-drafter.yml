# Release Drafter configuration (https://github.com/release-drafter/release-drafter).
#
# On every merge into master the draft release notes are rebuilt from the merged
# pull requests, grouped by label. Publishing the draft creates the tag
# v$RESOLVED_VERSION, which GitVersion then uses to stamp the binaries and name
# the artifacts (see docs/adr/0008 and docs/adr/0009).
#
# Labels the autolabeler applies must exist in the repo. Create these once
# (Settings -> Labels), or apply labels manually on each PR:
#   feature, fix, docs, chore, breaking, skip-changelog
#
# Both halves of Release Drafter v7 read this one file: the autolabeler
# sub-action uses the `autolabeler` block, the root action uses everything else.
#
# Categories use the `when` condition form. The older `categories[*].labels`,
# `exclude-labels` and `version-resolver.*.labels` fields still work but are
# deprecated and warn on every run; see release-drafter PR #1558.

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  # Exclusions first, so a labelled pull request never reaches the notes at all.
  - type: 'pre-exclude'
    when:
      label: 'skip-changelog'

  - title: '🚀 Features'
    when:
      labels: ['feature', 'enhancement']
  - title: '🐞 Bug Fixes'
    when:
      labels: ['fix', 'bug']
  - title: '📖 Documentation'
    when:
      labels: ['docs', 'documentation']
  - title: '🧰 Maintenance'
    when:
      labels: ['chore', 'refactor', 'build', 'ci', 'dependencies']

  # Next version, derived from the same labels (Semantic Versioning). A pull
  # request with no label at all falls through to version-resolver.default.
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      labels: ['major', 'breaking']
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      labels: ['minor', 'feature', 'enhancement']
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      labels: ['patch', 'fix', 'bug', 'docs', 'documentation', 'chore', 'refactor', 'build', 'ci']

version-resolver:
  default: patch

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'   # keep titles from breaking Markdown/mentions

template: |
  ## What's changed in $RESOLVED_VERSION

  $CHANGES

  **Full changelog:** https://github.com/motwok/DeGhoster/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

# Auto-apply labels from Conventional-Commit-style PR titles / branch names.
autolabeler:
  - label: 'feature'
    title: ['/^feat(\(.+\))?!?:/i', '/^feature/i']
    branch: ['/^feat(ure)?\//i']
  - label: 'fix'
    title: ['/^fix(\(.+\))?!?:/i']
    branch: ['/^fix\//i']
  - label: 'docs'
    title: ['/^docs(\(.+\))?:/i']
    branch: ['/^docs\//i']
  - label: 'chore'
    title: ['/^(chore|build|ci|refactor|perf|style|test)(\(.+\))?:/i']
    branch: ['/^(chore|build|ci|refactor)\//i']
  - label: 'breaking'
    title: ['/!:/', '/breaking[- ]change/i']
